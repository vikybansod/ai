apiVersion: v1
kind: Secret
metadata:
  name: chainlit-ui-auth
type: Opaque
stringData:
  # envsubst fills this from the shell's CHAINLIT_AUTH_SECRET variable.
  CHAINLIT_AUTH_SECRET: "${CHAINLIT_AUTH_SECRET}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainlit-ui
  labels:
    app: chainlit-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chainlit-ui
  template:
    metadata:
      labels:
        app: chainlit-ui
    spec:
      containers:
        - name: chainlit-ui
          image: chainlit_ui:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: AGENT_URL
              value: "${AGENT_URL}"
            - name: CHAINLIT_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: chainlit-ui-auth
                  key: CHAINLIT_AUTH_SECRET
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chainlit-ui
  labels:
    app: chainlit-ui
spec:
  type: ClusterIP
  selector:
    app: chainlit-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
