mode: deployment
fullnameOverride: otel-collector
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
extraEnvs:
  - name: LANGFUSE_AUTH_HEADER
    valueFrom:
      secretKeyRef:
        name: langfuse-exporter
        key: authorization
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch: {}
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 80
  exporters:
    debug: null
    otlp_http/langfuse:
      endpoint: http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel
      headers:
        Authorization: ${env:LANGFUSE_AUTH_HEADER}
        x-langfuse-ingestion-version: "4"
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/langfuse]
      metrics: null
      logs: null
