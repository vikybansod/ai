apiVersion: apps/v1
kind: Deployment
metadata:
  name: strands-agent
  labels:
    app: strands-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: strands-agent
  template:
    metadata:
      labels:
        app: strands-agent
    spec:
      containers:
        - name: strands-agent
          image: strands_agent:1.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DYNAMODB_ENDPOINT_URL
              value: http://dynamodb:8000
            - name: ORDERS_TABLE
              value: ecommerce_orders
            - name: AWS_REGION
              value: us-east-1
            - name: AI_GATEWAY_URL
              value: http://ai-gateway.envoy-gateway-system.svc.cluster.local/v1
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #   limits:
          #     cpu: "1"
          #     memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: strands-agent
  labels:
    app: strands-agent
spec:
  type: ClusterIP
  selector:
    app: strands-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
