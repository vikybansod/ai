apiVersion: v1
kind: Secret
metadata:
  name: strands-agent-openai
type: Opaque
stringData:
  # envsubst fills this from the shell's OPENAI_API_KEY variable.
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strands-agent
  labels:
    app: strands-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: strands-agent
  template:
    metadata:
      labels:
        app: strands-agent
    spec:
      containers:
        - name: strands-agent
          image: strands_agent:1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DYNAMODB_ENDPOINT_URL
              value: http://dynamodb:8000
            - name: ORDERS_TABLE
              value: ecommerce_orders
            - name: AWS_REGION
              value: us-east-1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: strands-agent-openai
                  key: OPENAI_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #   limits:
          #     cpu: "1"
          #     memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: strands-agent
  labels:
    app: strands-agent
spec:
  type: ClusterIP
  selector:
    app: strands-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
